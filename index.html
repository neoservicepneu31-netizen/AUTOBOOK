
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <meta name="description" content="Carnet d'entretien automobile intelligent et sécurisé" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AUTOBOOK" />
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png" />
    
    <title>AUTOBOOK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          document.body.innerHTML = `
            <div style="background:#121212; color:white; padding:20px; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
              <h1 style="color:#E63946; font-size:24px; margin-bottom:10px;">⚠️ Oups ! Erreur Technique</h1>
              <p style="color:#aaa; font-size:14px; margin-bottom:20px;">L'application a rencontré un problème critique.</p>
              <div style="background:#000; padding:10px; border-radius:5px; color:#f88; font-family:monospace; font-size:12px; max-width:90%; overflow:auto;">
                ${message}
              </div>
              <button onclick="window.location.reload()" style="margin-top:20px; padding:10px 20px; background:#E63946; border:none; color:white; border-radius:5px; font-weight:bold; cursor:pointer;">Relancer l'application</button>
            </div>
          `;
        }
      };

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nsp: {
                bg: '#121212',
                card: '#1E1E1E',
                primary: '#E63946',
                text: '#FFFFFF',
                sub: '#AAAAAA',
                success: '#2A9D8F',
                warning: '#E9C46A',
                input: '#2C2C2C',
                border: '#333333'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-nsp-bg text-nsp-text antialiased selection:bg-nsp-primary selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
